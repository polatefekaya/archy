name: Archy quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/archy-web/package-lock.json
      - run: dotnet restore Archy.sln
      - run: dotnet build Archy.sln --no-restore
      - run: dotnet test Archy.sln --no-restore --no-build
      - run: npm ci && npm run build
        working-directory: ui/archy-web
      - run: zsh scripts/verify-architecture-contracts.sh
      - run: sh scripts/ci/dependency-audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-reports
          path: artifacts/security
          if-no-files-found: warn
